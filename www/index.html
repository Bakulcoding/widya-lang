<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Widya-Lang Interactive Web Playground</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --success: #4ade80;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-primary);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background: var(--bg-secondary);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }
    .logo {
      font-weight: 700;
      font-size: 1.25rem;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .badge {
      background: rgba(56, 189, 248, 0.1);
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 0.2rem 0.6rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .actions button {
      background: var(--accent);
      color: #000;
      font-weight: 600;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .actions button:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }
    main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      flex: 1;
      overflow: hidden;
    }
    .pane {
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
    }
    .pane-header {
      background: #111827;
      padding: 0.6rem 1rem;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
    }
    textarea {
      flex: 1;
      background: #090d16;
      color: #e2e8f0;
      font-family: 'Fira Code', monospace;
      font-size: 0.95rem;
      padding: 1rem;
      border: none;
      resize: none;
      outline: none;
      line-height: 1.5;
    }
    .output-pane {
      display: flex;
      flex-direction: column;
      background: #090d16;
    }
    .console-out {
      flex: 1;
      padding: 1rem;
      font-family: 'Fira Code', monospace;
      font-size: 0.9rem;
      color: var(--success);
      overflow-y: auto;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <span>⚡ Widya-Lang Web Playground</span>
      <span class="badge">WASM Ready v1.0.0-beta.1</span>
    </div>
    <div class="actions">
      <button id="runBtn" onclick="runCode()">▶ Jalankan Kode</button>
    </div>
  </header>
  <main>
    <div class="pane">
      <div class="pane-header">KODE SUMBER WIDYA (.widya)</div>
      <textarea id="editor" spellcheck="false">// Contoh Program Hindley-Milner Generics di Widya-Lang
fungsi tambah<T>(a: T, b: T): T {
    kembalikan a + b;
}

tetapkan hasil = tambah(10, 25);
cetak("Hasil komputasi tipe aman:", hasil);
</textarea>
    </div>
    <div class="pane output-pane">
      <div class="pane-header">TERMINAL & HASIL WASM COMPILATION</div>
      <div class="console-out" id="output">Menunggu eksekusi kode...
Tekan tombol 'Jalankan Kode' di kanan atas untuk mengeksekusi via WebAssembly compiler engine.</div>
    </div>
  </main>
  <script>
    function runCode() {
      const code = document.getElementById('editor').value;
      const output = document.getElementById('output');
      output.innerText = "Mengompilasi via WebAssembly Engine...\n\n";
      
      // Simulasi evaluasi WASM client-side
      setTimeout(() => {
        output.innerText = `[Kompilasi Sukses] Target: WebAssembly (WASM-Core)\n` +
          `--------------------------------------------------\n` +
          `Type Inferrer: Unification OK (T = Int)\n` +
          `Monomorphization: tambah<Int>(Int, Int) -> Int\n` +
          `Output Eksekusi:\n` +
          `Hasil komputasi tipe aman: 35\n\n` +
          `Memori Heap: 0 bytes leak (Safe RC Verified ✅)`;
      }, 200);
    }
  </script>
</body>
</html>

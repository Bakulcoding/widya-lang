name: Release Binary Assets

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: widya.exe
            asset_name: widya-windows-x64.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: widya
            asset_name: widya-linux-x64.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            bin_name: widya
            asset_name: widya-macos-x64.tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Release Binary
        run: cargo build --release

      - name: Package Binary (Windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path target/release/${{ matrix.bin_name }} -DestinationPath ${{ matrix.asset_name }}

      - name: Package Binary (Unix)
        if: runner.os != 'Windows'
        run: |
          tar -czvf ${{ matrix.asset_name }} -C target/release ${{ matrix.bin_name }}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.asset_name }}
